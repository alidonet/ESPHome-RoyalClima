    icon: mdi:numeric
    entity_category: config
    min_value: 1
    max_value: 65535
    step: 1
    initial_value: 1883
    restore_value: true
    optimistic: true
    mode: box
  - platform: template
    id: humidity_target_control
    # Регистр 19 (RW): управление и подтверждённая уставка в одной сущности.
    name: "Humidity target"
    device_id: device_vent
    icon: mdi:water-percent
    entity_category: config
    disabled_by_default: true
    min_value: 1
    max_value: 99
