# ESPHome project for Royal Clima ERV, tested with RCS-650-P model.
# Created by Alido, 2026
# https://github.com/alidonet/RoyalClima

substitutions:
  name: royalclima
  tx_pin: GPIO17
  rx_pin: GPIO16
  en_pin: GPIO18
  baud_rate: "9600"  # SW4-4: ON = 9600, OFF = 4800.
  modbus_address: "1"  # Compile-time address; must match unit parameter 08.
  refresh_interval: 15s
  slow_refresh_interval: 5min
  response_timeout: 1200ms
  stale_timeout: 60s  # Keep the last reading for one minute without updates.

globals:
  - id: last_reply_ms
    type: uint32_t
    initial_value: '0'
  - id: has_reply
    type: bool
    initial_value: 'false'
  - id: offline_count
    type: uint32_t
    initial_value: '0'

  # Для трёх команд 9–11: ожидаемый код, время последней передачи и ожидание чтения.
  - id: command_expected
    type: std::array<int, 3>
    initial_value: '{-1, -1, -1}'
  - id: command_sent_ms
    type: std::array<uint32_t, 3>
    initial_value: '{0, 0, 0}'
  - id: command_waiting
    type: std::array<bool, 3>
    initial_value: '{false, false, false}'
  # Пароль не является состоянием сущности и не возвращается в API/MQTT.
  - id: mqtt_password_secret
    type: std::string
    restore_value: true
    max_restore_data_length: 128
    initial_value: '""'
  - id: mqtt_settings_valid
    type: bool
    initial_value: 'false'
esphome:
  min_version: 2026.11.0
  name: ${name}
  friendly_name: RoyalClima
  comment: "Modbus monitoring and control for Royal Clima Energy Recovery Ventilator"
  project:
    name: alidonet.royalclima
    version: 0.9.261122
  devices:
    - id: device_vent
      name: "Vent"
      relation: via

  on_boot:
    # После восстановления штатных полей (800/798), до запуска MQTT (200).
    - priority: 790
      then:
        # Списки задаются до подключения API/MQTT: метаданные соответствуют выбранному режиму.
        - lambda: |-
            if (id(fan_speed_mode).current_option() == "3") {
              id(supply_speed_control).traits.set_options({"0", "1", "2", "3"});
              id(exhaust_speed_control).traits.set_options({"0", "1", "2", "3"});
            }
        - script.execute: validate_mqtt_settings
        - lambda: |-
            if (!id(mqtt_settings_valid)) return;
            std::string topic = id(mqtt_topic_prefix).state;
            if (topic.empty()) {
              char mac[MAC_ADDRESS_BUFFER_SIZE];
              get_mac_address_into_buffer(mac);
              topic = std::string("royalclima_") + (mac + 6);
              id(mqtt_topic_prefix).publish_state(topic);
            }
            id(royalclima_mqtt).set_broker_address(id(mqtt_broker).state);
            id(royalclima_mqtt).set_broker_port(static_cast<uint16_t>(id(mqtt_port).state));
            id(royalclima_mqtt).set_username(id(mqtt_username).state);
            id(royalclima_mqtt).set_password(id(mqtt_password_secret));
            id(royalclima_mqtt).set_topic_prefix(topic);
            id(royalclima_mqtt).set_birth_message(mqtt::MQTTMessage{topic + "/status", "online", 0, true});
            id(royalclima_mqtt).set_last_will(mqtt::MQTTMessage{topic + "/status", "offline", 0, true});
            id(royalclima_mqtt).set_shutdown_message(mqtt::MQTTMessage{topic + "/status", "offline", 0, true});
            id(royalclima_mqtt).set_enable_on_boot(id(mqtt_enabled).state);
            id(mqtt_setup_status).publish_state(id(mqtt_enabled).state
                ? "MQTT enabled; API available" : "MQTT disabled; API available");
    - priority: -100
      then:
        - text.set:
            id: mqtt_password_input
            value: ""
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # advanced:
    #   minimum_chip_revision: "3.1"

wifi:
  # Wi-Fi задаётся пользователем через captive portal или Improv Serial.
  # Не задавать ssid/password/networks: сохранённая сеть сохраняется при обычном OTA.
  ap:
    ssid: "${name} Setup"
    ap_timeout: 30s
captive_portal:
improv_serial:

# Native API is always available; MQTT settings are standard ESPHome entities.
api:
  reboot_timeout: 0s

mqtt:
  id: royalclima_mqtt
  broker: ""
  enable_on_boot: false
  reboot_timeout: 0s
  idf_send_async: true
  log_topic: null

ota:
  - platform: esphome

logger:
  level: INFO
  initial_level: WARN
  # Summarize missing replies below instead of logging every retry/online transition.
  logs:
    modbus: ERROR
    modbus_controller: ERROR
    royalclima.command: INFO

web_server:
  local: true
  port: 80
  version: 3

output:
  - platform: gpio
    id: led_output
    pin: GPIO2

uart:
  id: royalclima_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  # Assumes EN connects DE and /RE: high = transmit, low = receive.
  flow_control_pin: ${en_pin}
  baud_rate: ${baud_rate}
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: royalclima_modbus
  uart_id: royalclima_uart
  send_wait_time: ${response_timeout}
  turnaround_time: 500ms

modbus_controller:
  - id: royalclima_controller
    modbus_id: royalclima_modbus
    address: ${modbus_address}
    update_interval: ${refresh_interval}
    max_cmd_retries: 1
    offline_skip_updates: 0
    # Фактическая передача FC06, включая повторы; чтение ставится в очередь после записи.
    on_command_sent:
      then:
        - lambda: |-
            if (function_code == 3) {
              for (int index = 0; index < 3; index++) {
                if (!id(command_waiting)[index]) continue;
                ESP_LOGI("royalclima.command", "TX read FC03: device=%u register=%d (awaiting command readback)",
                         unsigned(${modbus_address}), address);
                break;
              }
              return;
            }
            if (function_code != 6) return;
            ESP_LOGI("royalclima.command", "TX write FC06: device=%u register=%d",
                     unsigned(${modbus_address}), address);
            if (address >= 9 && address <= 11) {
              const int index = address - 9;
              if (id(command_expected)[index] >= 0) {
                id(command_sent_ms)[index] = millis();
                id(command_waiting)[index] = true;
              }
              id(refresh_main_after_write).execute();
            }
    on_offline: 
      then:
        - lambda: |-
            ESP_LOGI("royalclima.command", "NO RESPONSE: group=main FC=%02X register=%d; retries exhausted",
                     unsigned(function_code), address);
        - script.execute: report_modbus_failure

  # Same physical device and bus; only secondary reads use the slower schedule.
  - id: royalclima_slow_controller
    modbus_id: royalclima_modbus
    address: ${modbus_address}
    update_interval: ${slow_refresh_interval}
    max_cmd_retries: 1
    offline_skip_updates: 0
    # Только лог передачи FC06; уставки остаются на плановом опросе.
    on_command_sent:
      then:
        - lambda: |-
            if (function_code != 6) return;
            ESP_LOGI("royalclima.command", "TX write FC06: device=%u register=%d",
                     unsigned(${modbus_address}), address);
    on_offline:
      then:
        - lambda: |-
            ESP_LOGI("royalclima.command", "NO RESPONSE: group=slow FC=%02X register=%d; retries exhausted",
                     unsigned(function_code), address);
        - script.execute: report_modbus_failure

script:
  - id: validate_mqtt_settings
    then:
      - lambda: |-
          const auto &host = id(mqtt_broker).state;
          const auto &topic = id(mqtt_topic_prefix).state;
          std::string error;
          if (id(mqtt_enabled).state && host.empty()) error = "MQTT broker is required";
          for (unsigned char ch : host) {
            if (ch <= 32 || ch == '/' || ch == '?' || ch == '#' || ch == '@' || ch == 127)
              error = "Broker: use hostname or IP, without scheme, path or spaces";
          }
          if (topic.size() > 64 || (!topic.empty() && (topic.front() == '/' || topic.back() == '/')))
            error = "Topic: max 64 bytes, no leading or trailing slash";
          for (unsigned char ch : topic) {
            if (ch <= 32 || ch == '+' || ch == '#' || ch == 127)
              error = "Topic: no spaces, + or #";
          }
          const float port = id(mqtt_port).state;
          if (!std::isfinite(port) || port < 1 || port > 65535 || port != static_cast<uint16_t>(port))
            error = "MQTT port must be an integer from 1 to 65535";
          id(mqtt_settings_valid) = error.empty();
          if (!error.empty()) id(mqtt_setup_status).publish_state(error);
  - id: apply_mqtt_settings
    mode: single
    then:
      - script.execute: validate_mqtt_settings
      - if:
          condition:
            lambda: return id(mqtt_settings_valid);
          then:
            - text_sensor.template.publish:
                id: mqtt_setup_status
                state: "Saving settings; restarting ESP32"
            # Восстанавливаемая строковая global записывается штатным компонентом раз в секунду.
            - delay: 2s
            - lambda: |-
                if (!global_preferences->sync()) {
                  id(mqtt_setup_status).publish_state("Could not save settings; restart cancelled");
                  return;
                }
                App.safe_reboot();
  - id: refresh_ventilation_status
    mode: restart
    then:
      - delay: 10ms
      - component.update: ventilation_status
  - id: log_command_readback
    parameters:
      register_address: int
      raw_value: int
    then:
      - lambda: |-
          const int index = register_address - 9;
          if (index < 0 || index > 2 || !id(command_waiting)[index]) return;
          const int expected = id(command_expected)[index];
          const auto elapsed = uint32_t(millis() - id(command_sent_ms)[index]);
          if (index == 0) {
            ESP_LOGI("royalclima.command", "READBACK: Power %s; requested %s; %s (%lu ms after TX)",
                     raw_value ? "ON" : "OFF", expected ? "ON" : "OFF",
                     raw_value == expected ? "confirmed" : "not confirmed",
                     static_cast<unsigned long>(elapsed));
          } else {
            const int codes[] = {0, 2, 3, 5, 8, 9, 10, 11, 12, 13, 14};
            int actual_step = -1;
            int expected_step = -1;
            for (int step = 0; step <= 10; step++) {
              if (raw_value == codes[step]) actual_step = step;
              if (expected == codes[step]) expected_step = step;
            }
            ESP_LOGI("royalclima.command", "READBACK: %s speed %d (code %d); requested %d; %s (%lu ms after TX)",
                     index == 1 ? "Supply" : "Exhaust", actual_step, raw_value, expected_step,
                     raw_value == expected ? "confirmed" : "not confirmed",
                     static_cast<unsigned long>(elapsed));
          }
          // Первый результат чтения, а не гарантия, что ПВУ уже закончила применять команду.
          id(command_waiting)[index] = false;
          id(command_expected)[index] = -1;
  # Неблокирующая пауза даёт ПВУ время применить команду; шина сама ждёт ответа/таймаута записи.
  - id: refresh_main_after_write
    mode: restart
    then:
      # ПВУ может временно не отвечать сразу после записи; не начинать чтение слишком рано.
      - delay: 1s
      - component.update: royalclima_controller
      - delay: 10s
      - lambda: |-
          const char *names[] = {"Power", "Supply speed", "Exhaust speed"};
          for (int index = 0; index < 3; index++) {
            if (!id(command_waiting)[index]) continue;
            ESP_LOGI("royalclima.command", "READBACK: %s delayed; still awaiting readback (write outcome unknown until readback)", names[index]);
          }
      # Сохранять ожидание для позднего ответа планового опроса; не повторять запись автоматически.
      - delay: 50s
      - lambda: |-
          const char *names[] = {"Power", "Supply speed", "Exhaust speed"};
          for (int index = 0; index < 3; index++) {
            if (!id(command_waiting)[index]) continue;
            ESP_LOGI("royalclima.command", "READBACK: %s unconfirmed; no readback within tracking window", names[index]);
            id(command_waiting)[index] = false;
            id(command_expected)[index] = -1;
          }
  - id: report_modbus_failure
    then:
      # A failed command must not invalidate a still-fresh main block.
      - lambda: |-
          id(offline_count) += 1;
          static bool logged = false;
          static uint32_t last_warning_ms = 0;
          const uint32_t now = millis();
          if (!logged || uint32_t(now - last_warning_ms) >= 60000) {
            ESP_LOGW("main", "Modbus replies missing; offline events since boot: %lu; retaining data until stale timeout",
                     static_cast<unsigned long>(id(offline_count)));
            last_warning_ms = now;
            logged = true;
          }

#time:
#  - platform: sntp

# Holding-register reads use FC03; user controls write registers 9-11 with FC06. No startup writes.
# Registers 9-20 form one contiguous read; 25, 27 and 769 are separate reads.
# Secondary registers keep the last successful reading until reboot; main reads expire after stale_timeout.
sensor:
  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: power_raw
    # Регистр 9 (RW): исходное состояние установки, 0 — выключена, 1 — включена. Внутренний: нужен для вычислений, в HA не экспортируется.
    name: "Power raw"
    internal: true
    entity_category: diagnostic
    address: 9
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - timeout: ${stale_timeout}
    on_value:
      then:
        # Состояние питания публикуется сразу по чтению, без дополнительного таймера.
        - lambda: |-
            if (isnan(x)) return;
            id(ventilation_control).publish_state(x != 0);
            id(log_command_readback).execute(9, static_cast<int>(x));
        - script.execute: refresh_ventilation_status
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lambda: |-
                  id(last_reply_ms) = millis();
                  id(has_reply) = true;
              - output.turn_on: led_output
              - delay: 150ms
              - output.turn_off: led_output

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: supply_raw
    # Регистр 10 (RW): исходный код скорости приточного вентилятора. Внутренний: нужен для вычислений, в HA не экспортируется.
    name: "Supply code"
    internal: true
    entity_category: diagnostic
    address: 10
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    # Speed 0-10 maps to 0, 2, 3, 5, 8, 9, 10, 11, 12, 13, 14.
    device_id: device_vent
    filters:
      - timeout: ${stale_timeout}
    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) id(log_command_readback).execute(10, static_cast<int>(x));

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: exhaust_raw
    # Регистр 11 (RW): исходный код скорости вытяжного вентилятора. Внутренний: нужен для вычислений, в HA не экспортируется.
    name: "Exhaust code"
    internal: true
    entity_category: diagnostic
    address: 11
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - timeout: ${stale_timeout}
    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) id(log_command_readback).execute(11, static_cast<int>(x));

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    # Регистр 12 (R): температура комнатного/возвратного воздуха RA, °C; исходное значение минус 40.
    name: "Return temp"
    address: 12
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - offset: -40
      - timeout: ${stale_timeout}

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    # Регистр 13 (R): температура наружного воздуха OA, °C; исходное значение минус 40.
    name: "Outdoor temp"
    address: 13
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - offset: -40
      - timeout: ${stale_timeout}

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    # Регистр 14 (R): температура приточного воздуха SA, °C; исходное значение минус 40.
    name: "Supply temp"
    address: 14
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - offset: -40
      - timeout: ${stale_timeout}

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    # Регистр 15 (R): температура выбрасываемого воздуха FR, °C; исходное значение минус 40.
    name: "Exhaust temp"
    address: 15
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - offset: -40
      - timeout: ${stale_timeout}

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: status_raw
    # Регистр 18 (R): битовая маска пожарного сигнала, положения байпаса и разморозки. Внутренний: нужен для вычислений, в HA не экспортируется.
    name: "Status bits"
    internal: true
    address: 18
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    # Bits: 0 fire alarm, 1 bypass open, 2 bypass closed, 3 defrost.
    device_id: device_vent
    filters:
      - timeout: ${stale_timeout}

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: error_raw
    # Регистр 20 (R): битовая маска ошибок по DC-протоколу. Отключён по умолчанию.
    name: "Fault bits"
    disabled_by_default: true
    address: 20
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    # Error bits follow docs/Modbus protocol - DC (Primo).pdf.
    device_id: device_vent
    filters:
      - timeout: ${stale_timeout}

  - platform: wifi_signal
    # Уровень принимаемого сигнала Wi-Fi ESP32, дБм.
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    # Время работы ESP32 с последней перезагрузки, секунды.
    name: "Uptime"
    icon: mdi:clock-outline
    update_interval: 60s
    entity_category: diagnostic

  - platform: template
    # Время с последнего успешного чтения регистра 9, секунды; не относится к ответам других групп.
    name: "Data age"
    icon: mdi:timer-outline
    device_id: device_vent
    unit_of_measurement: s
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (!id(has_reply)) return NAN;
      return (uint32_t(millis()) - id(last_reply_ms)) / 1000.0f;

  - platform: template
    # Число переходов обеих групп опроса в offline с последней перезагрузки ESP32.
    name: "Offline count"
    icon: mdi:counter
    device_id: device_vent
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: ${refresh_interval}
    lambda: return id(offline_count);
  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: external_input_boost_signal_raw
    # Регистр 16 (R): сигнал форсирования по внешнему входу, 0 — неактивен, 1 — активен. Внутренний: нужен для вычислений, в HA не экспортируется.
    name: "External boost raw"
    internal: true
    address: 16
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    device_id: device_vent
    entity_category: diagnostic
    filters:
      - timeout: ${stale_timeout}
  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: sensor_boost_signal_raw
    # Регистр 17 (R): сигнал форсирования по датчику CO2 или влажности, в зависимости от настроек ПВУ.
    # 0 — неактивен, 1 — активен. В протоколе обозначен CO2; используется только внутри прошивки.
    name: "Sensor boost raw"
    internal: true
    address: 17
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    device_id: device_vent
    entity_category: diagnostic
    filters:
      - timeout: ${stale_timeout}
  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: humidity_setpoint
    # Регистр 19 (RW): заданная относительная влажность, 1–99 %; не текущее измерение.
    name: "Humidity target"
    internal: true
    icon: mdi:water-percent
    address: 19
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    device_id: device_vent
    entity_category: diagnostic
    filters:
      - timeout: ${stale_timeout}
    # Публичная уставка обновляется только по ответу ПВУ, включая потерю актуальности.
    on_value:
      then:
        - component.update: humidity_target_control

  - platform: modbus_controller
    modbus_controller_id: royalclima_slow_controller
    id: filter_interval_code
    # Регистр 25 (R): код интервала напоминания о фильтре, 0/1/2/3 — 45/60/90/180 дней. Внутренний: нужен для вычислений, в HA не экспортируется.
    name: "Filter code"
    internal: true
    address: 25
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    device_id: device_vent
    entity_category: diagnostic
    # Последнее успешное значение хранится в RAM до следующего чтения или перезагрузки.
    on_value:
      then:
        - component.update: filter_reminder_interval
        - component.update: filter_usage

  - platform: modbus_controller
    modbus_controller_id: royalclima_slow_controller
    id: heater_setpoint
    # Регистр 27 (RW): заданная температура включения/выключения нагревателя, 10–25 °C.
    name: "Heater target"
    internal: true
    icon: mdi:thermometer
    address: 27
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    device_id: device_vent
    entity_category: diagnostic
    # Публичная уставка обновляется только по ответу ПВУ, включая потерю актуальности.
    on_value:
      then:
        - component.update: heater_target_control

  - platform: template
    # Настроенный интервал напоминания о фильтре в днях; не оставшееся время до обслуживания.
    id: filter_reminder_interval
    name: "Filter interval"
    icon: mdi:timer-refresh-interval
    device_id: device_vent
    unit_of_measurement: d
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      const float raw = id(filter_interval_code).state;
      if (isnan(raw) || raw < 0 || raw > 3) return NAN;
      const int days[] = {45, 60, 90, 180};
      return days[static_cast<int>(raw)];

  - platform: modbus_controller
    modbus_controller_id: royalclima_slow_controller
    id: fan_runtime
    # Регистр 769 (R): наработка вентилятора, единица регистра — 0,1 часа.
    name: "Runtime"
    icon: mdi:fan-clock
    address: 769
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: h
    accuracy_decimals: 1
    device_id: device_vent
    filters:
      - multiply: 0.1
    # Последнее успешное значение хранится в RAM до следующего чтения или перезагрузки.
    on_value:
      then:
        - component.update: filter_usage

  - platform: template
    id: filter_usage
    # Доля наработки регистра 769 (R) от интервала регистра 25 (R); может превышать 100 %.
    name: "Filter usage"
    icon: mdi:air-filter
    device_id: device_vent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never
    lambda: |-
      const float hours = id(fan_runtime).state;
      const float days = id(filter_reminder_interval).state;
      if (!std::isfinite(hours) || !std::isfinite(days) || hours < 0 || days <= 0 ||
          !std::isfinite(id(filter_interval_code).state)) return NAN;
      return hours / (days * 24.0f) * 100.0f;

number:
  - platform: template
    id: mqtt_port
