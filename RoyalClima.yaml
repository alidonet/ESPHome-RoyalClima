    step: 1
    use_write_multiple: false
    write_lambda: |-
      ESP_LOGI("royalclima.command", "REQUEST: Set heater temperature setpoint to %.0f (FC06 register=27)", x);
      return x;

binary_sensor:
  - platform: status
    # Состояние подключения ESP32 к клиенту native API, например Home Assistant.
    name: "API connected"
    entity_category: diagnostic

  - platform: template
    # Основной блок 9–20 получен и не протух (stale_timeout); короткие сбои не гасят панель HA.
    # Не гарантирует свежесть отдельно читаемых 25, 27 и 769 или доставку команды управления.
    name: "Online"
    device_id: device_vent
    device_class: connectivity
    lambda: |-
      static uint32_t last_check = 0;
      const uint32_t now = millis();
      if (uint32_t(now - last_check) < 3000) return {};
      last_check = now;
      return id(has_reply) && !isnan(id(power_raw).state);
    entity_category: "diagnostic"   

  - platform: template
    id: bypass_open
    # Положение байпаса по битам 1 и 2 регистра 18: открыт/закрыт; обе одинаковые отметки — неизвестно.
    name: "Bypass open"
    icon: mdi:valve
    device_class: opening
    device_id: device_vent
    lambda: |-
      static uint32_t last_check = 0;
      const uint32_t now = millis();
      if (uint32_t(now - last_check) < 3000) return {};
      last_check = now;
      const float raw = id(status_raw).state;
      if (isnan(raw)) {
        id(bypass_open).invalidate_state();
        return {};
      }
      const uint16_t position = static_cast<uint16_t>(raw) & 0x06;
      if (position == 0x02) return true;
      if (position == 0x04) return false;
      id(bypass_open).invalidate_state();
      return {};
  - platform: template
    id: bypass_closed
    # Признак закрытия байпаса по биту 2 регистра 18. Вспомогательный сенсор, отключён по умолчанию.
    name: "Bypass closed"
    disabled_by_default: true
    entity_category: diagnostic
    icon: mdi:valve-closed
    device_id: device_vent
    lambda: |-
      static uint32_t last_check = 0;
      const uint32_t now = millis();
      if (uint32_t(now - last_check) < 3000) return {};
      last_check = now;
      const float raw = id(status_raw).state;
      if (isnan(raw)) {
        id(bypass_closed).invalidate_state();
        return {};
      }
      return (static_cast<uint16_t>(raw) & (1U << 2)) != 0;
  - platform: template
    id: defrost_active
    # Активна разморозка по биту 3 регистра 18.
    name: "Defrost"
    icon: mdi:snowflake-melt
    device_class: running
    device_id: device_vent
    lambda: |-
      static uint32_t last_check = 0;
      const uint32_t now = millis();
      if (uint32_t(now - last_check) < 3000) return {};
      last_check = now;
      const float raw = id(status_raw).state;
      if (isnan(raw)) {
        id(defrost_active).invalidate_state();
        return {};
      }
      return (static_cast<uint16_t>(raw) & (1U << 3)) != 0;
  - platform: template
    id: fire_alarm
    # Активен пожарный вход по биту 0 регистра 18; это сигнал установки, не отдельное измерение дыма.
    name: "Fire alarm"
    device_class: smoke
    device_id: device_vent
    lambda: |-
      static uint32_t last_check = 0;
      const uint32_t now = millis();
      if (uint32_t(now - last_check) < 3000) return {};
      last_check = now;
      const float raw = id(status_raw).state;
      if (isnan(raw)) {
        id(fire_alarm).invalidate_state();
        return {};
      }
      return (static_cast<uint16_t>(raw) & (1U << 0)) != 0;
  - platform: template
    id: ventilation_error
    # Есть ошибка: ненулевая маска регистра 20; выключен — ошибок нет.
    name: "Fault"
    device_class: problem
    entity_category: diagnostic
    device_id: device_vent
    lambda: |-
      static uint32_t last_check = 0;
      const uint32_t now = millis();
      if (uint32_t(now - last_check) < 3000) return {};
      last_check = now;
      const float raw = id(error_raw).state;
      if (isnan(raw)) {
        id(ventilation_error).invalidate_state();
        return {};
      }
      return raw != 0;
  - platform: template
    id: external_input_boost_active
    # Активно форсирование по внешнему входу по регистру 16.
    name: "External boost"
    icon: mdi:fan-plus
    device_class: running
    device_id: device_vent
    lambda: |-
      static uint32_t last_check = 0;
      const uint32_t now = millis();
      if (uint32_t(now - last_check) < 3000) return {};
      last_check = now;
      const float raw = id(external_input_boost_signal_raw).state;
      if (isnan(raw)) {
        id(external_input_boost_active).invalidate_state();
        return {};
      }
      return raw == 1;
  - platform: template
    id: sensor_boost_active
    # Форсирование по датчику CO2 или влажности выбирается на самой ПВУ (SW4-3).
    # Регистр 17 — признак активности, не измеренная концентрация или влажность.
    # В протоколе регистр назван CO2; поведение в режиме влажности пока не проверено.
    name: "Sensor boost"
    icon: mdi:fan-auto
    device_class: running
    device_id: device_vent
    lambda: |-
      static uint32_t last_check = 0;
      const uint32_t now = millis();
      if (uint32_t(now - last_check) < 3000) return {};
      last_check = now;
      const float raw = id(sensor_boost_signal_raw).state;
      if (isnan(raw)) {
        id(sensor_boost_active).invalidate_state();
        return {};
      }
      return raw == 1;

text_sensor:
  - platform: template
    id: mqtt_setup_status
    # Результат проверки и применения настроек; секреты не публикуются.
    name: "MQTT setup status"
    disabled_by_default: true
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: never
  - platform: template
    # Версия проекта в установленной прошивке.
    name: "Version"
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: return {ESPHOME_PROJECT_VERSION};
  - platform: template
    # Описание работы установки на выбранном языке ru/en.
    id: ventilation_status
    name: "Status"
    icon: mdi:air-filter
    device_id: device_vent
    update_interval: 3s
    lambda: |-
      const bool english = id(message_language).current_option() == "en";
      const float raw = id(status_raw).state;
      if (isnan(raw)) return {(english ? "No current data" : "Нет актуальных данных")};
      const uint16_t flags = static_cast<uint16_t>(raw);
      std::string result;
      if (!isnan(id(power_raw).state)) {
        result = id(power_raw).state == 0 ? (english ? "Off" : "Выключен") : (english ? "Running" : "Работает");
      } else {
        result = (english ? "Power: no current data" : "Питание: нет актуальных данных");
      }
      if (flags & 0x01) result += (english ? "; Fire alarm" : "; Пожарный сигнал");
      if (flags & 0x02) result += (english ? "; Bypass open" : "; Байпас открыт");
      if (flags & 0x08) result += (english ? "; Defrosting" : "; Разморозка");
      if (flags & 0xFFF0) {
        result += (english ? "; Unknown flags: " : "; Неизвестные флаги: ") + std::to_string(flags & 0xFFF0);
      }
      return result;

  - platform: template
    # Расшифровка битов ошибок регистра 20 на выбранном языке с числовым кодом.
    name: "Fault details"
    icon: mdi:alert-octagon-outline
    device_id: device_vent
    entity_category: diagnostic
    update_interval: 3s
    # Bit map from docs/Modbus protocol - DC (Primo).pdf.
    lambda: |-
      const bool english = id(message_language).current_option() == "en";
      const float raw = id(error_raw).state;
      if (isnan(raw)) return {(english ? "No current data" : "Нет актуальных данных")};
      const uint16_t code = static_cast<uint16_t>(raw);
      if (code == 0) return {(english ? "No errors" : "Ошибок нет")};
      std::string result = (english ? "Error: " : "Ошибка: ");
      const char *messages[] = {
        (english ? "Outdoor air temperature sensor OA" : "Датчик наружной температуры OA"),
        (english ? "EEPROM memory" : "Память EEPROM"),
        (english ? "Return air temperature sensor RA" : "Датчик комнатной температуры RA"),
        (english ? "Exhaust air temperature sensor EA" : "Датчик вытяжной температуры EA"),
        (english ? "No data" : "Нет данных"),
        (english ? "Supply air temperature sensor SA" : "Датчик приточной температуры SA"),
        (english ? "Supply fan" : "Приточный вентилятор"),
        (english ? "Exhaust fan" : "Вытяжной вентилятор")
      };
      bool first = true;
      for (int bit = 0; bit < 8; bit++) {
        if ((code & (1U << bit)) && messages[bit] != nullptr) {
          if (!first) result += "; ";
          result += messages[bit];
          first = false;
        }
      }
      if (code & 0xFF10) {
        if (!first) result += "; ";
        result += (english ? "Unknown bits" : "Неизвестные биты");
      }
      result += (english ? " (code " : " (код ") + std::to_string(code) + ")";
      return result;
button:
  - platform: template
    # Проверить настройки MQTT, сбросить очередь flash-записей и перезагрузить только ESP32.
    name: "MQTT apply"
    disabled_by_default: true
    icon: mdi:content-save-settings
    entity_category: config
    on_press:
      - script.execute: apply_mqtt_settings
  - platform: template
    # Удалить сохранённый пароль; новое подключение после MQTT apply.
    name: "MQTT clear password"
    disabled_by_default: true
    icon: mdi:lock-remove-outline
    entity_category: config
    on_press:
      - lambda: |-
          id(mqtt_password_secret).clear();
          id(mqtt_setup_status).publish_state("Password cleared; press MQTT apply to reconnect");
  - platform: restart
    # Удалённая перезагрузка ESP32 с ESPHome; плата рекуператора не перезапускается.
    name: "Reboot"
    id: esp32_reboot
    icon: mdi:restart
    entity_category: diagnostic
switch:
  - platform: template
    id: mqtt_enabled
    # Выбор MQTT для следующего запуска; API всегда доступен.
    name: "MQTT enabled"
    disabled_by_default: true
    icon: mdi:message-settings-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: ventilation_control
    # Публикуется только прочитанное питание регистра 9 (RW); команды не меняют состояние заранее.
    name: "Power"
    device_id: device_vent
    icon: mdi:power
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - switch.turn_on: ventilation_power_writer
    turn_off_action:
      - switch.turn_off: ventilation_power_writer
  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: ventilation_power_writer
    # Внутренний исполнитель FC06 для регистра 9 (RW), не создаёт сущность в HA.
    internal: true
    register_type: holding
    address: 9
    bitmask: 1
    use_write_multiple: false
    restore_mode: DISABLED
    write_lambda: |-
      ESP_LOGI("royalclima.command", "REQUEST: Turn power %s (FC06 register=9 value=%u)", x ? "ON" : "OFF", unsigned(x));
      id(command_expected)[0] = x ? 1 : 0;
      id(command_waiting)[0] = false;
      return x;

select:
  - platform: template
    id: fan_speed_mode
    # Число ступеней адаптера; сохраняется, применяется перезапуском ESP32, не меняет параметры ПВУ.
    name: "Fan speeds"
    device_id: device_vent
    icon: mdi:fan-cog
    entity_category: config
    disabled_by_default: true
    options:
      - "3"
      - "10"
    initial_option: "10"
    optimistic: false
    restore_value: true
    set_action:
      - if:
          condition:
            lambda: return x != id(fan_speed_mode).current_option();
          then:
            - lambda: id(fan_speed_mode).publish_state(x);
            - delay: 2s
            - lambda: |-
                global_preferences->sync();
                App.safe_reboot();
  - platform: template
    id: message_language
    # Язык текстовых статусов и ошибок; сохраняется после перезагрузки, обновление в течение 3 с.
    name: "Language"
    icon: mdi:translate
    entity_category: config
    options:
      - "ru"
      - "en"
    initial_option: "en"
    optimistic: true
    restore_value: true
  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: supply_speed_control
    # Регистр 10 (RW): выбор ступени вентилятора; код протокола преобразуется в понятную скорость.
    name: "Supply speed"
    device_id: device_vent
    icon: mdi:fan-chevron-down
    address: 10
    # Не искать индекс за пределами укороченного списка при неверном режиме или внешнем изменении скорости.
    lambda: |-
      if (id(fan_speed_mode).current_option() == "3" && x > 5)
        return std::string("unsupported");
      return {};
    value_type: U_WORD
    use_write_multiple: false
    optimistic: false
    # Запрос пользователя до постановки записи в очередь; TX ниже означает фактическую передачу.
    write_lambda: |-
      ESP_LOGI("royalclima.command", "REQUEST: Set supply speed to %s (FC06 register=10 value=%lld)", x.c_str(), static_cast<long long>(value));
      id(command_expected)[1] = static_cast<int>(value);
      id(command_waiting)[1] = false;
      return value;
    optionsmap:
      "0": 0
      "1": 2
      "2": 3
      "3": 5
      "4": 8
      "5": 9
      "6": 10
      "7": 11
      "8": 12
      "9": 13
      "10": 14
  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    id: exhaust_speed_control
    # Регистр 11 (RW): выбор ступени вентилятора; код протокола преобразуется в понятную скорость.
    name: "Exhaust speed"
    device_id: device_vent
    icon: mdi:fan-chevron-up
    address: 11
    # Не искать индекс за пределами укороченного списка при неверном режиме или внешнем изменении скорости.
    lambda: |-
      if (id(fan_speed_mode).current_option() == "3" && x > 5)
        return std::string("unsupported");
      return {};
    value_type: U_WORD
    use_write_multiple: false
    optimistic: false
    # Запрос пользователя до постановки записи в очередь; TX ниже означает фактическую передачу.
    write_lambda: |-
      ESP_LOGI("royalclima.command", "REQUEST: Set exhaust speed to %s (FC06 register=11 value=%lld)", x.c_str(), static_cast<long long>(value));
      id(command_expected)[2] = static_cast<int>(value);
      id(command_waiting)[2] = false;
      return value;
    optionsmap:
      "0": 0
      "1": 2
      "2": 3
      "3": 5
      "4": 8
      "5": 9
      "6": 10
      "7": 11
      "8": 12
      "9": 13
      "10": 14

# Штатные поля веб-интерфейса ESPHome; отдельной страницы настройки нет.
text:
  - platform: template
    id: mqtt_broker
    # Имя или IP MQTT-брокера без схемы URI; применяется после MQTT apply.
    name: "MQTT broker"
    disabled_by_default: true
    icon: mdi:server-network
    entity_category: config
    mode: text
    max_length: 128
    initial_value: ""
    optimistic: true
    restore_value: true
  - platform: template
    id: mqtt_username
    # Необязательный логин брокера; применяется после MQTT apply.
    name: "MQTT username"
    disabled_by_default: true
    icon: mdi:account-outline
    entity_category: config
    mode: text
    max_length: 128
    initial_value: ""
    optimistic: true
    restore_value: true
  - platform: template
    id: mqtt_topic_prefix
    # До 64 байт; пустое сохранённое значение выбирает royalclima_<последние 6 цифр MAC>.
    name: "MQTT topic"
    disabled_by_default: true
    icon: mdi:format-list-bulleted
    entity_category: config
    mode: text
    max_length: 64
    initial_value: ""
    optimistic: true
    restore_value: true
  - platform: template
    id: mqtt_password_input
    # Только ввод: пустая строка сохраняет прежний пароль, секрет хранится отдельно.
    name: "MQTT password"
    disabled_by_default: true
    icon: mdi:lock-outline
    entity_category: config
    mode: password
    max_length: 128
    update_interval: never
    lambda: return {""};
    set_action:
      - lambda: |-
          if (!x.empty()) {
            id(mqtt_password_secret) = x;
            id(mqtt_setup_status).publish_state("Password updated; press MQTT apply to reconnect");
          }
          id(mqtt_password_input).publish_state("");
