# Скопировать в каталог ESPHome как royalclima.yaml вместо полной копии основной прошивки.
# Нужны локальные !secret wifi_ssid, wifi_password, wifi_ssid2, wifi_password2.
# Git проверяется при валидации/сборке с учётом refresh; автоматической установки нет.
substitutions:
  name: royalclima
  tx_pin: GPIO17
  rx_pin: GPIO16
  en_pin: GPIO18

packages:
  royalclima:
    url: https://github.com/alidonet/RoyalClima
    ref: main  # Можно заменить тегом или commit SHA для фиксации версии.
    files:
      - ESPHome/RoyalClima.yaml
    refresh: 1h

# Локальные настройки API/OTA/сети добавляйте здесь с использованием !secret.
