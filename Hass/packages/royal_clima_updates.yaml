# Необязательный пакет: скопировать в /config/packages/royal_clima_updates.yaml.
# После проверки конфигурации HA перезапустить: добавляется интеграция REST.
# Проверяется версия исходников main, а не свежесть файлов bin/*.bin; сборка и OTA вручную.
# Нужен sensor.royal_clima_project_version из новой ESPHome-прошивки; сверить ID в реестре HA.
# При другой ветке изменить URL. Та же версия при новых коммитах не считается обновлением.
royal_clima_updates:
  rest:
    - resource: https://raw.githubusercontent.com/alidonet/RoyalClima/main/ESPHome/RoyalClima.yaml
      scan_interval: 86400  # Проверка раз в сутки; вручную — homeassistant.update_entity.
      timeout: 15
      sensor:
        - name: "Royal Clima latest project version"
          unique_id: royal_clima_latest_project_version
          icon: mdi:tag-outline
          value_template: >-
            {% set versions = value | regex_findall('(?m)^    version: ([0-9]+[.][0-9]+[.][0-9]{6})[ ]*\r?$') %}
            {{ versions[0] if versions | count == 1 else 'unknown' }}

  template:
    - binary_sensor:
        - name: "Royal Clima update available"
          unique_id: royal_clima_update_available
          default_entity_id: binary_sensor.royal_clima_update_available
          device_class: update
          availability: >-
            {{ has_value('sensor.royal_clima_project_version')
               and has_value('sensor.royal_clima_latest_project_version') }}
          state: >-
            {{ version(states('sensor.royal_clima_latest_project_version')) >
               version(states('sensor.royal_clima_project_version')) }}
          attributes:
            installed_version: "{{ states('sensor.royal_clima_project_version') }}"
            latest_version: "{{ states('sensor.royal_clima_latest_project_version') }}"
            source_url: https://github.com/alidonet/RoyalClima/commits/main/ESPHome/RoyalClima.yaml
  input_text:
    # Без initial: HA восстанавливает последнее значение после перезапуска.
    royal_clima_last_notified_version:
      name: Royal Clima last notified version
      max: 64
      icon: mdi:tag-check-outline

  automation:
    - id: royal_clima_notify_new_version
      alias: "Royal Clima: новая версия прошивки"
      mode: single
      triggers:
        - trigger: state
          entity_id: binary_sensor.royal_clima_update_available
          to: "on"
        # Следующая версия может появиться, пока предыдущая ещё не установлена.
        - trigger: state
          entity_id: sensor.royal_clima_latest_project_version
          to: null
        - trigger: homeassistant
          event: start
      conditions:
        - condition: state
          entity_id: binary_sensor.royal_clima_update_available
          state: "on"
        - condition: template
          value_template: >-
            {{ has_value('sensor.royal_clima_latest_project_version')
               and has_value('sensor.royal_clima_project_version')
               and version(states('sensor.royal_clima_latest_project_version')) >
                   version(states('sensor.royal_clima_project_version'))
               and states('input_text.royal_clima_last_notified_version') not in ['unknown', 'unavailable']
               and states('sensor.royal_clima_latest_project_version') !=
                   states('input_text.royal_clima_last_notified_version') }}
      actions:
        - variables:
            latest: "{{ states('sensor.royal_clima_latest_project_version') }}"
        - action: persistent_notification.create
          data:
            notification_id: royal_clima_new_version
            title: "Royal Clima: доступна новая версия"
            message: >-
              Доступна версия {{ latest }}.
              Установлена {{ states('sensor.royal_clima_project_version') }}.
              [Изменения](https://github.com/alidonet/RoyalClima/commits/main/ESPHome/RoyalClima.yaml).
              Сборка и OTA — вручную через ESPHome.
        - action: input_text.set_value
          target:
            entity_id: input_text.royal_clima_last_notified_version
          data:
            value: "{{ latest }}"
