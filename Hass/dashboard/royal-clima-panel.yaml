# Автоязык: ru — русский, остальные — английский. После смены языка HA перезагрузите дашборд.
# Нужны card-mod и Config Template Card (HACS).
# Скопируйте royal-clima-panel.svg, royal-clima-panel-fan.svg в /config/www/images/.
# Управление: обёртки из Hass/packages/royal_clima.yaml.
# Ступени 0–10, не RPM. Период вращения 2.95–0.7 с; при нуле/потере связи CSS-анимация приостановлена (тот же SVG).
# Предподогрев на мини-схеме пока статичный символ без привязки к неподтверждённой сущности.
# Семисегментные показания — inline SVG, без зависимости от шрифта.
# Общий SVG содержит геометрию; русские/английские подписи формируются здесь один раз для всех состояний.
type: "custom:config-template-card"
variables:
  - "(this.hass.locale?.language || this.hass.language || 'en').toLowerCase().startsWith('ru')"
  - "(value, right = false) => { const n=Number(value); const str=(value === 'unknown' || value === 'unavailable' || value == null || !Number.isFinite(n)) ? '--' : String(Math.round(n*10)/10); const polys=['4,1 20,1 22,3 20,5 4,5 2,3','21,5 23,3 25,5 25,19 23,21 21,19','21,23 23,21 25,23 25,37 23,39 21,37','4,37 20,37 22,39 20,41 4,41 2,39','1,23 3,21 5,23 5,37 3,39 1,37','1,5 3,3 5,5 5,19 3,21 1,19','4,19 20,19 22,21 20,23 4,23 2,21']; const masks=[63,6,91,79,102,109,125,7,127,111]; let x=0,parts=''; for(const c of str){if(c==='.'){parts+='<circle cx=\"'+(x+2)+'\" cy=\"39\" r=\"2\"/>';x+=7;continue;}const mask=c==='-'?64:masks[Number(c)];parts+='<g transform=\"translate('+x+' 0)\">'+polys.map((p,i)=>(mask&(1<<i))?'<polygon points=\"'+p+'\"/>':'').join('')+'</g>';x+=29;} return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 46\"><g transform=\"translate('+(right ? 100-x : (100-x)/2)+' 1)\" fill=\"#30392b\">'+parts+'</g></svg>'); }"
  - "(text, width, size, weight = 400) => { const escaped=String(text).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 '+width+' 28\"><text x=\"'+width/2+'\" y=\"14\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"'+size+'\" font-weight=\"'+weight+'\" fill=\"#444e3c\">'+escaped+'</text></svg>'); }"
entities:
  - "sensor.ventilation_system_outdoor_air_temperature"
  - "sensor.ventilation_system_return_air_temperature"
  - "sensor.ventilation_system_exhaust_air_temperature"
  - "sensor.ventilation_system_supply_air_temperature"
  - "select.royal_clima_exhaust_speed"
  - "select.royal_clima_supply_speed"
  - "binary_sensor.royal_clima_esp32_connection"
  - "binary_sensor.ventilation_system_vent_system_online"
  - "binary_sensor.ventilation_system_ventilation_error"
  - "binary_sensor.ventilation_system_fire_alarm"
  - "binary_sensor.ventilation_system_bypass_open"
  - "binary_sensor.ventilation_system_defrost_active"
  - "binary_sensor.royal_clima_filter_replacement_recommended"
  - "binary_sensor.ventilation_system_external_input_boost_active"
  - "binary_sensor.ventilation_system_sensor_boost_active"
  - "switch.royal_clima_power"
  - "binary_sensor.ventilation_system_ventilation_power"
  - "sensor.ventilation_system_exhaust_fan_speed"
  - "sensor.ventilation_system_supply_fan_speed"
card:
  type: "vertical-stack"
  cards:
    -
      type: "picture-elements"
      image: "/local/images/royal-clima-panel.svg"
      card_mod:
        style: ":host { display:block; width:85% !important; margin:0 auto; }\nha-card { padding:0; border:0; border-radius:14px; overflow:hidden; background:transparent; }\n@keyframes rc-spin { from { transform:translate(-50%, -50%) rotate(0deg); } to { transform:translate(-50%, -50%) rotate(360deg); } }\n@media (prefers-reduced-motion: reduce) { hui-image-element { animation:none !important; } }"
