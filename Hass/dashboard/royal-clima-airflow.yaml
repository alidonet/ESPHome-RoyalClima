# Карточка схемы потоков: один YAML с автоязыком и общий SVG без языковых подписей. Нужны Config Template Card и Mushroom (HACS).
# Скопируйте royal-clima-airflow.svg и royal-clima-fan.svg в /config/www/images/.
# Язык профиля HA: ru — русский, остальные — английский; после смены языка перезагрузите дашборд.
# Постоянные подписи формируются здесь один раз для всех состояний; SVG содержит только геометрию и прочерки.
# Скорости — ступени 0–10; FR — выброс воздуха, регистр 17 — признак форсирования по датчику. Связь не гарантирует свежесть всех регистров.
type: custom:config-template-card
variables:
- (this.hass.locale?.language || this.hass.language || 'en').toLowerCase().startsWith('ru')
- '(text, width = 200, left = false) => { const escaped = String(text).replace(/[&<>]/g, c => ({''&'':''&amp;'',''<'':''&lt;'',''>'':''&gt;''}[c]));
  return ''data:image/svg+xml;charset=utf-8,'' + encodeURIComponent(''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0
  ''+width+'' 28"><text x="''+(left ? 0 : width/2)+''" y="14" dominant-baseline="central" text-anchor="''+(left ? ''start''
  : ''middle'')+''" font-family="Arial,sans-serif" font-size="20" fill="#34465b">''+escaped+''</text></svg>''); }'
entities:
- binary_sensor.royal_clima_esp32_connection
- binary_sensor.royal_clima_filter_replacement_recommended
- binary_sensor.ventilation_system_bypass_open
- binary_sensor.ventilation_system_sensor_boost_active
- binary_sensor.ventilation_system_defrost_active
- binary_sensor.ventilation_system_external_input_boost_active
- binary_sensor.ventilation_system_fire_alarm
- binary_sensor.ventilation_system_vent_system_online
- binary_sensor.ventilation_system_ventilation_error
- binary_sensor.ventilation_system_ventilation_power
- select.royal_clima_exhaust_speed
- select.royal_clima_supply_speed
- sensor.ventilation_system_exhaust_air_temperature
- sensor.ventilation_system_exhaust_fan_speed
- sensor.ventilation_system_outdoor_air_temperature
- sensor.ventilation_system_return_air_temperature
- sensor.ventilation_system_supply_air_temperature
- sensor.ventilation_system_supply_fan_speed
- switch.royal_clima_power
card:
  type: picture-elements
  image: /local/images/royal-clima-airflow.svg#idle
  elements:
  - type: conditional
    conditions:
    - entity: binary_sensor.royal_clima_esp32_connection
      state: 'on'
    - entity: binary_sensor.ventilation_system_vent_system_online
      state: 'on'
    - entity: binary_sensor.ventilation_system_ventilation_power
      state: 'on'
    elements:
    - type: image
      image: /local/images/royal-clima-airflow.svg#running
      filter: none
      style:
        left: 50%
        top: 50%
        width: 100%
        pointer-events: none
      tap_action:
        action: none
      hold_action:
        action: none
  - type: conditional
    conditions:
    - entity: binary_sensor.royal_clima_esp32_connection
      state: 'on'
    - entity: binary_sensor.ventilation_system_vent_system_online
      state: 'on'
    - entity: binary_sensor.ventilation_system_ventilation_power
      state: 'off'
    elements:
    - type: image
      image: /local/images/royal-clima-airflow.svg#off
      filter: none
      title: '${vars[0] ? "ПВУ выключена" : "AHU is off"}'
      style:
        left: 50%
        top: 50%
        width: 100%
        pointer-events: none
      tap_action:
        action: none
      hold_action:
        action: none
  - type: conditional
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity: binary_sensor.royal_clima_esp32_connection
        state_not: 'on'
      - condition: state
        entity: binary_sensor.ventilation_system_vent_system_online
        state_not: 'on'
    elements:
    - type: image
      image: /local/images/royal-clima-airflow.svg#disconnected
      filter: none
      title: '${vars[0] ? "Нет подтверждённой связи с ПВУ" : "No confirmed connection to the AHU"}'
      style:
        left: 50%
        top: 50%
        width: 100%
        pointer-events: none
      tap_action:
        action: none
      hold_action:
        action: none
  - type: icon
    entity: binary_sensor.royal_clima_esp32_connection
    icon: mdi:chip
    title: '${vars[0] ? "Связь ESP32 с Home Assistant" : "ESP32 connection to Home Assistant"}'
    style:
      left: 47.34375%
      top: 8.39844%
      color: '#96a2af'
      --mdc-icon-size: 18px
    tap_action:
      action: more-info
  - type: icon
    entity: binary_sensor.ventilation_system_vent_system_online
    icon: mdi:hvac
    title: '${vars[0] ? "Связь с установкой по Modbus" : "AHU Modbus connection"}'
    style:
      left: 52.65625%
      top: 8.39844%
      color: '#96a2af'
      --mdc-icon-size: 18px
    tap_action:
      action: more-info
  - type: conditional
    conditions:
    - entity: binary_sensor.royal_clima_esp32_connection
      state: 'on'
    - entity: binary_sensor.ventilation_system_vent_system_online
      state: 'on'
    elements:
    - type: conditional
      conditions:
      - entity: sensor.ventilation_system_outdoor_air_temperature
        state_not: unknown
      - entity: sensor.ventilation_system_outdoor_air_temperature
        state_not: unavailable
      elements:
      - type: state-label
        entity: sensor.ventilation_system_outdoor_air_temperature
        title: '${vars[0] ? "Наружный воздух · OA" : "Outdoor air · OA"}'
        style:
          left: 19.53125%
          top: 16.01562%
          width: 18.75%
          padding: 0
          background-color: '#f8fafc'
          color: '#087f9f'
          text-align: center
          font-size: clamp(20px, 5.5vw, 34px)
          font-weight: 600
          white-space: nowrap
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - entity: sensor.ventilation_system_return_air_temperature
        state_not: unknown
      - entity: sensor.ventilation_system_return_air_temperature
        state_not: unavailable
      elements:
      - type: state-label
        entity: sensor.ventilation_system_return_air_temperature
        title: '${vars[0] ? "Возврат из помещения · RA" : "Return air · RA"}'
        style:
          left: 80.46875%
          top: 16.01562%
          width: 18.75%
          padding: 0
          background-color: '#f8fafc'
          color: '#a34172'
          text-align: center
          font-size: clamp(20px, 5.5vw, 34px)
          font-weight: 600
          white-space: nowrap
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - entity: sensor.ventilation_system_exhaust_air_temperature
        state_not: unknown
      - entity: sensor.ventilation_system_exhaust_air_temperature
        state_not: unavailable
      elements:
      - type: state-label
        entity: sensor.ventilation_system_exhaust_air_temperature
        title: '${vars[0] ? "Датчик разморозки · FR (не температура выброса)" : "Defrost sensor · FR (not an exhaust air measurement)"}'
        style:
          left: 19.53125%
          top: 66.40625%
          width: 18.75%
          padding: 0
          background-color: '#f8fafc'
          color: '#3674a7'
          text-align: center
          font-size: clamp(20px, 5.5vw, 34px)
          font-weight: 600
          white-space: nowrap
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - entity: sensor.ventilation_system_supply_air_temperature
        state_not: unknown
      - entity: sensor.ventilation_system_supply_air_temperature
        state_not: unavailable
      elements:
      - type: state-label
        entity: sensor.ventilation_system_supply_air_temperature
        title: '${vars[0] ? "Приток в помещение · SA" : "Supply air · SA"}'
        style:
          left: 80.46875%
          top: 66.40625%
          width: 18.75%
          padding: 0
          background-color: '#f8fafc'
          color: '#bb5529'
          text-align: center
          font-size: clamp(20px, 5.5vw, 34px)
          font-weight: 600
          white-space: nowrap
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - entity: sensor.ventilation_system_supply_fan_speed
        state_not: unknown
      - entity: sensor.ventilation_system_supply_fan_speed
        state_not: unavailable
      elements:
      - type: state-label
        entity: sensor.ventilation_system_supply_fan_speed
        suffix: ' / 10'
        title: '${vars[0] ? "Ступень приточного вентилятора · 0 означает остановку" : "Supply fan step · 0 means stopped"}'
        style:
          left: 80.46875%
          top: 90.82062%
          width: 15%
          padding: 0
          background-color: '#edf2f7'
          color: '#34465b'
          text-align: center
          font-size: clamp(12px, 3.2vw, 22px)
          font-weight: 600
          white-space: nowrap
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - entity: sensor.ventilation_system_exhaust_fan_speed
        state_not: unknown
      - entity: sensor.ventilation_system_exhaust_fan_speed
        state_not: unavailable
      elements:
      - type: state-label
        entity: sensor.ventilation_system_exhaust_fan_speed
        suffix: ' / 10'
        title: '${vars[0] ? "Ступень вытяжного вентилятора · 0 означает остановку" : "Exhaust fan step · 0 means stopped"}'
        style:
          left: 36.71844%
          top: 90.82062%
          width: 15%
          padding: 0
          background-color: '#edf2f7'
          color: '#34465b'
          text-align: center
          font-size: clamp(12px, 3.2vw, 22px)
          font-weight: 600
          white-space: nowrap
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - entity: switch.royal_clima_power
        state_not: unknown
      - entity: switch.royal_clima_power
        state_not: unavailable
      elements:
      - type: state-icon
        entity: switch.royal_clima_power
        icon: mdi:power
        title: '${vars[0] ? "Включить / выключить установку" : "Turn the AHU on / off"}'
        state_color: true
        style:
          left: 50%
          top: 90.82062%
          width: 5.93719%
          height: 7.42219%
          display: flex
          align-items: center
          justify-content: center
          background-color: '#edf2f7'
          border-radius: 10px
          --mdc-icon-size: 16px
        tap_action:
          action: toggle
    - type: conditional
      conditions:
      - entity: binary_sensor.ventilation_system_ventilation_power
        state: 'on'
      - entity: select.royal_clima_supply_speed
        state_not: '0'
      - entity: select.royal_clima_supply_speed
        state_not: unknown
      - entity: select.royal_clima_supply_speed
        state_not: unavailable
      elements:
      - type: image
        entity: select.royal_clima_supply_speed
        image: /local/images/royal-clima-fan.svg
        filter: none
        title: '${vars[0] ? "Приточный вентилятор · включён, ступень больше нуля" : "Supply fan · enabled, nonzero step"}'
        style:
          left: 64.0625%
          top: 50.97687%
          width: 8.74969%
          padding: 0.62531%
          box-sizing: border-box
          border-radius: 50%
          background-color: rgba(248, 250, 252, 0.65)
          opacity: 0.38
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - entity: binary_sensor.ventilation_system_ventilation_power
        state: 'on'
      - entity: select.royal_clima_exhaust_speed
        state_not: '0'
      - entity: select.royal_clima_exhaust_speed
        state_not: unknown
      - entity: select.royal_clima_exhaust_speed
        state_not: unavailable
      elements:
      - type: image
        entity: select.royal_clima_exhaust_speed
        image: /local/images/royal-clima-fan.svg
        filter: none
        title: '${vars[0] ? "Вытяжной вентилятор · включён, ступень больше нуля" : "Exhaust fan · enabled, nonzero step"}'
        style:
          left: 35.9375%
          top: 50.97687%
          width: 8.74969%
          padding: 0.62531%
          box-sizing: border-box
          border-radius: 50%
          background-color: rgba(248, 250, 252, 0.65)
          opacity: 0.38
        tap_action:
          action: more-info
  - type: conditional
    conditions:
    - entity: binary_sensor.royal_clima_esp32_connection
      state: 'on'
    elements:
    - type: icon
      entity: binary_sensor.royal_clima_esp32_connection
      icon: mdi:chip
      title: '${vars[0] ? "Связь ESP32 с Home Assistant" : "ESP32 connection to Home Assistant"}'
      style:
        left: 47.34375%
        top: 8.39844%
        color: '#4f8fad'
        --mdc-icon-size: 18px
      tap_action:
        action: more-info
  - type: conditional
    conditions:
    - entity: binary_sensor.royal_clima_esp32_connection
      state: 'on'
    - entity: binary_sensor.ventilation_system_vent_system_online
      state: 'on'
    elements:
    - type: icon
      entity: binary_sensor.ventilation_system_vent_system_online
      icon: mdi:hvac
      title: '${vars[0] ? "Связь с установкой по Modbus" : "AHU Modbus connection"}'
      style:
        left: 52.65625%
        top: 8.39844%
        color: '#4f8fad'
        --mdc-icon-size: 18px
      tap_action:
        action: more-info
  - type: conditional
    conditions:
    - entity: binary_sensor.royal_clima_esp32_connection
      state: 'on'
    - entity: binary_sensor.ventilation_system_vent_system_online
      state: 'on'
    - condition: or
      conditions:
      - condition: state
        entity: binary_sensor.ventilation_system_fire_alarm
        state: 'on'
      - condition: state
        entity: binary_sensor.ventilation_system_ventilation_error
        state: 'on'
      - condition: state
        entity: binary_sensor.royal_clima_filter_replacement_recommended
        state: 'on'
      - condition: state
        entity: binary_sensor.ventilation_system_defrost_active
        state: 'on'
      - condition: state
        entity: binary_sensor.ventilation_system_bypass_open
        state: 'on'
      - condition: state
        entity: binary_sensor.ventilation_system_external_input_boost_active
        state: 'on'
      - condition: state
        entity: binary_sensor.ventilation_system_sensor_boost_active
        state: 'on'
    elements:
    - type: custom:mushroom-chips-card
      alignment: center
      style:
        left: 50%
        top: 28.125%
        width: max-content
        max-width: 41%
        box-sizing: border-box
        padding: 3px 5px
        line-height: 0
        font-size: 0
        border-radius: 10px
        border: 0.5px solid rgba(145, 165, 186, 0.16)
        background-color: rgba(248, 250, 252, 0.8)
        opacity: 0.9
        --chip-height: clamp(18px, 4vw, 22px)
        --chip-icon-size: calc(var(--chip-height) - 4px)
        --chip-padding: 0 2px
        --chip-spacing: 2px
        --chip-background: transparent
        --chip-box-shadow: none
        --chip-border-width: 0px
      chips:
      - type: conditional
        conditions:
        - entity: binary_sensor.ventilation_system_fire_alarm
          state: 'on'
        chip:
          type: entity
          entity: binary_sensor.ventilation_system_fire_alarm
          name: '${vars[0] ? "Пожарный вход" : "Fire alarm input"}'
          icon: mdi:fire-alert
          icon_color: red
          content_info: none
          tap_action:
            action: more-info
      - type: conditional
        conditions:
        - entity: binary_sensor.ventilation_system_ventilation_error
          state: 'on'
        chip:
          type: entity
          entity: binary_sensor.ventilation_system_ventilation_error
          name: '${vars[0] ? "Ошибка установки" : "AHU fault"}'
          icon: mdi:alert-circle-outline
          icon_color: red
          content_info: none
          tap_action:
            action: more-info
      - type: conditional
        conditions:
        - entity: binary_sensor.royal_clima_filter_replacement_recommended
          state: 'on'
        chip:
          type: entity
          entity: binary_sensor.royal_clima_filter_replacement_recommended
          name: '${vars[0] ? "Рекомендуется замена фильтра" : "Filter replacement recommended"}'
          icon: mdi:air-filter
          icon_color: amber
          content_info: none
          tap_action:
            action: more-info
      - type: conditional
        conditions:
        - entity: binary_sensor.ventilation_system_defrost_active
          state: 'on'
        chip:
          type: entity
          entity: binary_sensor.ventilation_system_defrost_active
          name: '${vars[0] ? "Разморозка" : "Defrosting"}'
          icon: mdi:snowflake-melt
          icon_color: blue
          content_info: none
          tap_action:
            action: more-info
      - type: conditional
        conditions:
        - entity: binary_sensor.ventilation_system_bypass_open
          state: 'on'
        chip:
          type: entity
          entity: binary_sensor.ventilation_system_bypass_open
          name: '${vars[0] ? "Байпас открыт" : "Bypass open"}'
          icon: mdi:valve
          icon_color: blue
          content_info: none
          tap_action:
            action: more-info
      - type: conditional
        conditions:
        - entity: binary_sensor.ventilation_system_external_input_boost_active
          state: 'on'
        chip:
          type: entity
          entity: binary_sensor.ventilation_system_external_input_boost_active
          name: '${vars[0] ? "Внешнее форсирование" : "External boost"}'
          icon: mdi:fan-plus
          icon_color: amber
          content_info: none
          tap_action:
            action: more-info
      - type: conditional
        conditions:
        - entity: binary_sensor.ventilation_system_sensor_boost_active
          state: 'on'
        chip:
          type: entity
          entity: binary_sensor.ventilation_system_sensor_boost_active
          name: '${vars[0] ? "Форсирование по CO₂ (не ppm)" : "CO₂ boost (not a ppm reading)"}'
          icon: mdi:molecule-co2
          icon_color: amber
          content_info: none
          tap_action:
            action: more-info
  - type: image
    image: '${vars[1]((vars[0] ? "Улица · OA" : "Outdoor · OA"), 200, false)}'
    filter: none
    style:
      left: 19.5312%
      top: 8.39844%
      width: 31.25%
      pointer-events: none
    tap_action:
      action: none
    hold_action:
      action: none
  - type: image
    image: '${vars[1]((vars[0] ? "Возврат · RA" : "Return · RA"), 200, false)}'
    filter: none
    style:
      left: 80.4688%
      top: 8.39844%
      width: 31.25%
      pointer-events: none
    tap_action:
      action: none
    hold_action:
      action: none
  - type: image
    image: '${vars[1]((vars[0] ? "Вытяжка · FR" : "Exhaust · FR"), 200, false)}'
    filter: none
    style:
      left: 19.5312%
      top: 73.2422%
      width: 31.25%
      pointer-events: none
    tap_action:
      action: none
    hold_action:
      action: none
  - type: image
    image: '${vars[1]((vars[0] ? "Приток · SA" : "Supply · SA"), 200, false)}'
    filter: none
    style:
      left: 80.4688%
      top: 73.2422%
      width: 31.25%
      pointer-events: none
    tap_action:
      action: none
    hold_action:
      action: none
  - type: image
    image: '${vars[1]((vars[0] ? "Вытяжка" : "Exhaust"), 110, true)}'
    filter: none
    style:
      left: 22.8125%
      top: 90.8203%
      width: 17.1875%
      pointer-events: none
    tap_action:
      action: none
    hold_action:
      action: none
  - type: image
    image: '${vars[1]((vars[0] ? "Приток" : "Supply"), 110, true)}'
    filter: none
    style:
      left: 66.5625%
      top: 90.8203%
      width: 17.1875%
      pointer-events: none
    tap_action:
      action: none
    hold_action:
      action: none
grid_options:
  columns: 12
  rows: auto
