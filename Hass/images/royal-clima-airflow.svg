<svg xmlns="http://www.w3.org/2000/svg" width="640" height="512" viewBox="80 -16 640 512" role="img" aria-labelledby="title">
  <title id="title">Температуры и воздушные потоки</title>
  <defs>
    <linearGradient id="supply">
      <stop stop-color="#25b9df" />
      <stop offset="1" stop-color="#ef8450" />
    </linearGradient>
    <linearGradient id="exhaust">
      <stop stop-color="#639ed0" />
      <stop offset="1" stop-color="#ce6998" />
    </linearGradient>
    <linearGradient id="case" x2="0" y2="1">
      <stop stop-color="#f8fbfe" />
      <stop offset="1" stop-color="#dce6f0" />
    </linearGradient>
    <linearGradient id="rim" x2="0" y2="1">
      <stop stop-color="#b0c1d1" />
      <stop offset="1" stop-color="#8da2b8" />
    </linearGradient>
    <linearGradient id="cover" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".24" />
      <stop offset="1" stop-color="#fff" stop-opacity=".04" />
    </linearGradient>
    <linearGradient id="duct" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".65" />
      <stop offset=".5" stop-color="#d9e3ed" stop-opacity=".25" />
      <stop offset="1" stop-color="#99acc0" stop-opacity=".55" />
    </linearGradient>
    <mask id="exhaust-gap" maskUnits="userSpaceOnUse" x="265" y="115" width="270" height="190">
      <rect x="265" y="115" width="270" height="190" fill="#fff" />
      <path d="M265 170H305C370 170 430 260 495 260H535" fill="none" stroke="#000" stroke-width="32" />
    </mask>
    <linearGradient id="off-off-face" x2="0" y2="1">
      <stop stop-color="#91a4b7" />
      <stop offset="1" stop-color="#c8d4e0" />
    </linearGradient>
    <path id="off-power" d="M34 32A38 38 0 1 0 86 32M60 16V58" />
    <filter id="off-inset" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation=".8" />
      <feOffset dx="1" dy="1" />
      <feComposite in2="SourceAlpha" operator="in" result="inner-edge" />
      <feFlood flood-color="#52687e" flood-opacity=".45" />
      <feComposite in2="inner-edge" operator="in" />
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode />
      </feMerge>
    </filter>
    <linearGradient id="disconnected-link-face" x2="0" y2="1">
      <stop stop-color="#91a4b7" />
      <stop offset="1" stop-color="#c8d4e0" />
    </linearGradient>
    <path id="disconnected-broken-link" d="M70 63L84 49A18 18 0 0 0 59 24L45 38M50 57L36 71A18 18 0 0 0 61 96L75 82M34 25 29 18M23 39 15 36M86 95 91 102M97 81 105 84" />
    <filter id="disconnected-inset" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation=".8" />
      <feOffset dx="1" dy="1" />
      <feComposite in2="SourceAlpha" operator="in" result="inner-edge" />
      <feFlood flood-color="#52687e" flood-opacity=".45" />
      <feComposite in2="inner-edge" operator="in" />
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode />
      </feMerge>
    </filter>
    <style>
.when-running,.when-off,.when-disconnected{display:none}
#running:target ~ .scene .when-running{display:inline}
#off:target ~ .scene .when-off{display:inline}
#disconnected:target ~ .scene .when-disconnected{display:inline}
</style>
  </defs>
  <g id="idle" />
  <g id="running" />
  <g id="off" />
  <g id="disconnected" />
  <g class="scene">
    <rect x="80" y="-16" width="640" height="512" rx="22" fill="#f8fafc" />
    <g font-family="Arial, sans-serif">
      <g transform="translate(0 -15)">
        <rect x="265" y="115" width="270" height="190" rx="7" fill="url(#case)" />
        <g id="internals" opacity=".3" stroke="#8da0b3" stroke-width="1" stroke-linejoin="round" class="when-running">
          <rect x="270" y="120" width="260" height="180" rx="5" fill="#d3dde7" fill-opacity=".24" />
          <g fill="#d3dde7" fill-opacity=".45">
            <path d="M270 208H320L322 210 320 212H270Z" />
            <path d="M480 208H530V212H480L478 210Z" />
            <path d="M398 120H402V130L400 132 398 130Z" />
            <path d="M400 288 402 290V300H398V290Z" />
          </g>
          <path d="M400 132 478 210 400 288 322 210Z" fill="#cedae7" fill-opacity=".45" />
          <path d="M400 136 474 210 400 284 326 210Z" fill="none" />
        </g>
        <path d="M535 170H495C430 170 370 260 305 260H265" fill="none" stroke="url(#exhaust)" stroke-width="22" opacity=".45" mask="url(#exhaust-gap)" class="when-running" />
        <path d="M265 170H305C370 170 430 260 495 260H535" fill="none" stroke="url(#supply)" stroke-width="22" opacity=".45" class="when-running" />
        <path d="M148.5 159H265V181H148.5L156.5 170Z" fill="#25b9df" class="when-running" />
        <path d="M651.5 159H535V181H651.5L643.5 170Z" fill="#ce6998" class="when-running" />
        <path d="M265 249H166.5V244L148.5 260 166.5 276V271H265Z" fill="#639ed0" class="when-running" />
        <path d="M535 249H633.5V244L651.5 260 633.5 276V271H535Z" fill="#ef8450" class="when-running" />
        <rect x="265" y="115" width="270" height="190" rx="7" fill="url(#cover)" />
        <g fill="url(#duct)" stroke="#91a5ba" stroke-opacity=".65" stroke-width="1.5">
          <rect x="253" y="151" width="12" height="38" rx="2" />
          <rect x="535" y="151" width="12" height="38" rx="2" />
          <rect x="253" y="241" width="12" height="38" rx="2" />
          <rect x="535" y="241" width="12" height="38" rx="2" />
        </g>
        <rect x="265" y="115" width="270" height="190" rx="7" fill="none" stroke="url(#rim)" stroke-width="1.25" />
        <rect x="267" y="117" width="266" height="186" rx="5" fill="none" stroke="#fff" stroke-opacity=".5" />
      </g>
      <g text-anchor="middle" dominant-baseline="central" font-size="36" fill="#8798aa">
        <text x="205" y="66">—</text>
        <text x="595" y="66">—</text>
        <text x="205" y="324">—</text>
        <text x="595" y="324">—</text>
      </g>
      <g fill="#edf2f7" stroke="#dce4ed">
        <rect x="155" y="430" width="210" height="38" rx="10" />
        <rect x="381" y="430" width="38" height="38" rx="10" />
        <rect x="435" y="430" width="210" height="38" rx="10" />
      </g>
      <g text-anchor="middle" dominant-baseline="central" font-size="23" fill="#8798aa">
        <text x="315" y="449">—</text>
        <text x="595" y="449">—</text>
      </g>
      <path d="M395 442A9 9 0 1 0 405 442 M400 437V447" fill="none" stroke="#a2adbb" stroke-width="2" stroke-linecap="round" />
      <svg x="340" y="135" width="120" height="120" viewBox="0 0 120 120" class="when-off">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".5">
          <use href="#off-power" transform="translate(.7 1)" stroke="#fff" stroke-width="12" opacity=".65" />
          <use href="#off-power" stroke="url(#off-off-face)" stroke-width="10" filter="url(#off-inset)" />
        </g>
      </svg>
      <svg x="340" y="135" width="120" height="120" viewBox="0 0 120 120" class="when-disconnected">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".5">
          <use href="#disconnected-broken-link" transform="translate(.7 1)" stroke="#fff" stroke-width="10" opacity=".65" />
          <use href="#disconnected-broken-link" stroke="url(#disconnected-link-face)" stroke-width="8" filter="url(#disconnected-inset)" />
        </g>
      </svg>
    </g>
  </g>
</svg>